<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>V.A.S.T. 5 - Emergent Hydrodynamics Simulator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #080a0f;
      color: #d1d5db;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
    }
    #app {
      display: flex;
      width: 100vw;
      height: 100vh;
    }
    #viewport-container {
      flex: 1;
      position: relative;
      background: radial-gradient(circle at center, #111827 0%, #030712 100%);
    }
    #canvas3d {
      width: 100%;
      height: 100%;
      display: block;
    }
    #hud {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 8px;
      padding: 16px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      min-width: 280px;
      z-index: 10;
    }
    #hud h1 {
      font-size: 1.1rem;
      letter-spacing: 2px;
      color: #38bdf8;
      margin-bottom: 12px;
      text-transform: uppercase;
      font-weight: 700;
      border-bottom: 1px solid rgba(56, 189, 248, 0.2);
      padding-bottom: 6px;
    }
    .hud-metric {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.85rem;
      font-family: monospace;
    }
    .hud-label {
      color: #9ca3af;
    }
    .hud-value {
      color: #f3f4f6;
      font-weight: 600;
    }
    .hud-value.source {
      color: #4ade80;
    }
    .hud-value.sink {
      color: #f87171;
    }
    #controls {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }
    button {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #475569;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.2s ease;
      flex: 1;
    }
    button:hover {
      background: #334155;
      border-color: #38bdf8;
      color: #38bdf8;
    }
    button.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
    }
    #right-panel {
      width: 340px;
      background: #0f172a;
      border-left: 1px solid rgba(56, 189, 248, 0.2);
      display: flex;
      flex-direction: column;
      z-index: 10;
      box-shadow: -4px 0 20px rgba(0, 0, 0, 0.4);
    }
    .panel-header {
      padding: 16px;
      background: #1e293b;
      border-bottom: 1px solid rgba(56, 189, 248, 0.2);
    }
    .panel-title {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #38bdf8;
      text-transform: uppercase;
    }
    .panel-subtitle {
      font-size: 0.75rem;
      color: #9ca3af;
      margin-top: 4px;
    }
    #manifest-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }
    .manifest-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .manifest-card:hover {
      border-color: #38bdf8;
      background: #334155;
    }
    .manifest-card.selected {
      border-color: #38bdf8;
      background: rgba(14, 165, 233, 0.2);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }
    .manifest-symbol {
      width: 36px;
      height: 36px;
      border-radius: 4px;
      background: #090d16;
      border: 1px solid #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.9rem;
      color: #38bdf8;
      margin-right: 12px;
    }
    .manifest-info {
      flex: 1;
    }
    .manifest-name {
      font-size: 0.85rem;
      font-weight: 600;
      color: #f3f4f6;
    }
    .manifest-tpes {
      font-size: 0.75rem;
      color: #9ca3af;
      font-family: monospace;
      margin-top: 2px;
    }
    .selected-indicator {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 10px;
      background: #0284c7;
      color: #ffffff;
      font-weight: 600;
    }
    #click-tooltip {
      position: absolute;
      pointer-events: none;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #38bdf8;
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 0.75rem;
      color: #38bdf8;
      font-family: monospace;
      display: none;
      z-index: 100;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="viewport-container">
      <div id="hud">
        <h1>V.A.S.T. 5 Engine</h1>
        <div class="hud-metric">
          <span class="hud-label">Global Source Bus:</span>
          <span id="source-bus-val" class="hud-value source">0</span>
        </div>
        <div class="hud-metric">
          <span class="hud-label">Global Sink Bus:</span>
          <span id="sink-bus-val" class="hud-value sink">0</span>
        </div>
        <div class="hud-metric">
          <span class="hud-label">Compton Ticks:</span>
          <span id="tick-val" class="hud-value">0</span>
        </div>
        <div class="hud-metric">
          <span class="hud-label">Active Voxels:</span>
          <span id="active-voxels-val" class="hud-value">0</span>
        </div>
        <div class="hud-metric">
          <span class="hud-label">Selected Element:</span>
          <span id="selected-element-val" class="hud-value" style="color:#38bdf8;">Carbon-12</span>
        </div>
        <div id="controls">
          <button id="btn-toggle">Play</button>
          <button id="btn-step">Step</button>
          <button id="btn-reset">Reset</button>
        </div>
      </div>
      <div id="click-tooltip"></div>
      <canvas id="canvas3d"></canvas>
    </div>

    <div id="right-panel">
      <div class="panel-header">
        <div class="panel-title">Universal System Schema</div>
        <div class="panel-subtitle">Select an entity to inject into the 3D lattice</div>
      </div>
      <div id="manifest-list"></div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
